<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AeroChamber</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-strong: #1f2937;
        --line: #374151;
        --text: #f9fafb;
        --muted: #cbd5e1;
        --positive: #34d399;
        --warning: #fbbf24;
        --accent: #60a5fa;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
        color: var(--text);
        min-height: 100vh;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
      }

      .app {
        max-width: 640px;
        margin: 0 auto;
      }

      .card {
        background: rgba(31, 41, 55, 0.96);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 16px;
        padding: 1rem;
        box-shadow: 0 12px 30px rgba(15, 23, 42, 0.4);
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0 0 0.75rem;
        font-size: clamp(1.7rem, 5vw, 2.4rem);
        letter-spacing: 0.04em;
      }

      .sensor-list {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
        margin-top: 0.5rem;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 0.75rem;
        align-items: center;
        padding: 0.7rem 0.75rem;
        background: rgba(17, 24, 39, 0.75);
        border: 1px solid var(--line);
        border-radius: 10px;
      }

      .sensor-label {
        font-weight: 700;
      }

      .sensor-values {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
        gap: 0.15rem;
        font-size: 0.95rem;
      }

      .status {
        margin-top: 1rem;
        font-weight: bold;
        color: var(--positive);
      }

      .history-panel {
        margin-top: 1rem;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin-bottom: 0.85rem;
      }

      button {
        flex: 1 1 120px;
        min-height: 2.6rem;
        border: 0;
        border-radius: 10px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, opacity 0.2s ease;
      }

      button:active { transform: scale(0.98); }
      button.secondary { background: #374151; }
      button.warning { background: #b45309; }
      button.danger { background: #b91c1c; }

      .sensor-selector {
        display: flex;
        flex-wrap: wrap;
        gap: 0.55rem;
        margin-bottom: 0.8rem;
      }

      .sensor-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0.4rem 0.7rem;
        color: var(--muted);
        font-size: 0.9rem;
      }

      .sensor-toggle input {
        accent-color: var(--accent);
        width: 1rem;
        height: 1rem;
      }

      .chart-wrap {
        position: relative;
        height: 260px;
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }

      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      .empty-state {
        color: var(--muted);
        padding: 1rem;
        text-align: center;
      }

      @media (min-width: 700px) {
        .app { max-width: 820px; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="card">
        <h1>AeroChamber</h1>
        <div id="sensor-list" class="sensor-list"></div>
        <div class="status" id="status">Connecting...</div>
      </div>

      <div class="card history-panel">
        <div class="toolbar">
          <button id="stop-btn" class="secondary" type="button">Stop</button>
          <button id="start-btn" type="button">Start</button>
          <button id="reset-btn" class="warning" type="button">Reset</button>
          <button id="share-plot-btn" class="secondary" type="button">Share plot</button>
          <button id="share-data-btn" class="danger" type="button">Share data</button>
        </div>

        <div id="sensor-selector" class="sensor-selector"></div>

        <div class="chart-wrap">
          <canvas id="history-chart" width="600" height="260"></canvas>
        </div>
      </div>
    </div>

    <script>
      const state = {
        historyRunning: true,
        history: {},
        selectedSensors: new Set(),
        maxPoints: 180,
        sensorIds: [],
        selectorInitialized: false
      };

      const sensorList = document.getElementById('sensor-list');
      const sensorSelector = document.getElementById('sensor-selector');
      const chart = document.getElementById('history-chart');
      const ctx = chart.getContext('2d');

      const sensorColors = {
        1: '#60a5fa',
        2: '#34d399',
        3: '#fbbf24',
        4: '#f472b6',
        5: '#a78bfa',
        6: '#f87171'
      };

      function updateStatus(message, isError = false) {
        const status = document.getElementById('status');
        status.textContent = message;
        status.style.color = isError ? '#f87171' : '#34d399';
      }

      function renderSensorList(sensors) {
        sensorList.innerHTML = '';

        if (!Array.isArray(sensors) || sensors.length === 0) {
          sensorList.innerHTML = '<div class="row"><span>No sensors</span></div>';
          return;
        }

        sensors.forEach((sensor) => {
          const row = document.createElement('div');
          row.className = 'row';

          const label = document.createElement('span');
          label.className = 'sensor-label';
          label.textContent = `Sensor ${sensor.sensorId}`;

          const values = document.createElement('div');
          values.className = 'sensor-values';
          if (sensor.valid) {
            values.innerHTML = `
              <span>${Number(sensor.temperatureC ?? 0).toFixed(2)} °C</span>
              <span>${Number(sensor.pressurePa ?? 0).toFixed(2)} Pa</span>
            `;
          } else {
            values.innerHTML = '<span>No data</span><span>--</span>';
          }

          row.appendChild(label);
          row.appendChild(values);
          sensorList.appendChild(row);
        });
      }

      function renderSensorSelector(sensors) {
        sensorSelector.innerHTML = '';
        state.sensorIds = sensors.map((sensor) => Number(sensor.sensorId));

        if (state.sensorIds.length === 0) {
          return;
        }

        if (!state.selectorInitialized) {
          state.sensorIds.forEach((sensorId) => state.selectedSensors.add(sensorId));
          state.selectorInitialized = true;
        }

        const activeSelections = new Set(
          Array.from(state.selectedSensors).filter((sensorId) => state.sensorIds.includes(sensorId))
        );
        state.selectedSensors.clear();
        activeSelections.forEach((sensorId) => state.selectedSensors.add(sensorId));

        state.sensorIds.forEach((sensorId) => {
          const label = document.createElement('label');
          label.className = 'sensor-toggle';

          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = state.selectedSensors.has(sensorId);
          input.addEventListener('change', (event) => {
            if (event.target.checked) {
              state.selectedSensors.add(sensorId);
            } else {
              state.selectedSensors.delete(sensorId);
            }
            renderHistoryChart();
          });

          const text = document.createElement('span');
          text.textContent = `Sensor ${sensorId}`;

          label.appendChild(input);
          label.appendChild(text);
          sensorSelector.appendChild(label);
        });
      }

      function recordHistory(samples) {
        if (!state.historyRunning) {
          return;
        }

        samples.forEach((sensor) => {
          const sensorId = Number(sensor.sensorId);
          const pressurePa = Number(sensor.pressurePa ?? 0);

          if (!sensor.valid || !Number.isFinite(pressurePa)) {
            return;
          }

          if (!state.history[sensorId]) {
            state.history[sensorId] = [];
          }

          const timestamp = Date.now();
          state.history[sensorId].push({ timestamp, pressurePa });

          if (state.history[sensorId].length > state.maxPoints) {
            state.history[sensorId].shift();
          }
        });

        renderHistoryChart();
      }

      function drawGrid(width, height, padding) {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.25)';
        ctx.lineWidth = 1;

        for (let i = 0; i <= 5; i += 1) {
          const y = padding.top + ((height - padding.top - padding.bottom) / 5) * i;
          ctx.beginPath();
          ctx.moveTo(padding.left, y);
          ctx.lineTo(width - padding.right, y);
          ctx.stroke();
        }

        for (let i = 0; i <= 5; i += 1) {
          const x = padding.left + ((width - padding.left - padding.right) / 5) * i;
          ctx.beginPath();
          ctx.moveTo(x, padding.top);
          ctx.lineTo(x, height - padding.bottom);
          ctx.stroke();
        }
      }

      function renderHistoryChart() {
        const width = chart.width;
        const height = chart.height;
        const padding = { top: 20, right: 20, bottom: 30, left: 48 };

        ctx.clearRect(0, 0, width, height);
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, width, height);

        const selectedIds = Array.from(state.selectedSensors).filter((sensorId) => state.history[sensorId]?.length);

        if (selectedIds.length === 0) {
          ctx.fillStyle = '#cbd5e1';
          ctx.font = '16px Arial';
          ctx.textAlign = 'center';
          ctx.fillText('No pressure history available', width / 2, height / 2);
          return;
        }

        const values = selectedIds.flatMap((sensorId) => state.history[sensorId].map((point) => point.pressurePa));
        const minValue = Math.min(...values);
        const maxValue = Math.max(...values);
        const range = Math.max(maxValue - minValue, 1);

        drawGrid(width, height, padding);

        ctx.fillStyle = '#cbd5e1';
        ctx.font = '12px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(`${maxValue.toFixed(0)}`, padding.left - 8, padding.top + 4);
        ctx.fillText(`${((maxValue + minValue) / 2).toFixed(0)}`, padding.left - 8, height / 2);
        ctx.fillText(`${minValue.toFixed(0)}`, padding.left - 8, height - padding.bottom + 4);

        ctx.textAlign = 'center';
        ctx.fillText('Time', width / 2, height - 8);

        selectedIds.forEach((sensorId) => {
          const points = state.history[sensorId];
          const color = sensorColors[sensorId] || '#60a5fa';
          ctx.beginPath();

          points.forEach((point, index) => {
            const x = padding.left + (index / Math.max(points.length - 1, 1)) * (width - padding.left - padding.right);
            const normalized = (point.pressurePa - minValue) / range;
            const y = height - padding.bottom - normalized * (height - padding.top - padding.bottom);

            if (index === 0) {
              ctx.moveTo(x, y);
            } else {
              ctx.lineTo(x, y);
            }
          });

          ctx.strokeStyle = color;
          ctx.lineWidth = 2.2;
          ctx.stroke();

          const lastPoint = points[points.length - 1];
          const lastX = padding.left + (points.length - 1) / Math.max(points.length - 1, 1) * (width - padding.left - padding.right);
          const normalizedLast = (lastPoint.pressurePa - minValue) / range;
          const lastY = height - padding.bottom - normalizedLast * (height - padding.top - padding.bottom);

          ctx.fillStyle = color;
          ctx.beginPath();
          ctx.arc(lastX, lastY, 4, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      function handleStart() {
        state.historyRunning = true;
        document.getElementById('start-btn').disabled = true;
        document.getElementById('stop-btn').disabled = false;
      }

      function handleStop() {
        state.historyRunning = false;
        document.getElementById('start-btn').disabled = false;
        document.getElementById('stop-btn').disabled = true;
      }

      function handleReset() {
        state.history = {};
        renderHistoryChart();
      }

      async function sharePlot() {
        try {
          const dataUrl = chart.toDataURL('image/png');
          if (navigator.share) {
            const response = await fetch(dataUrl);
            const blob = await response.blob();
            const file = new File([blob], 'aerochamber-plot.png', { type: 'image/png' });
            await navigator.share({
              title: 'AeroChamber plot',
              text: 'Pressure history plot',
              files: [file]
            });
            return;
          }

          const link = document.createElement('a');
          link.download = 'aerochamber-plot.png';
          link.href = dataUrl;
          link.click();
        } catch (error) {
          updateStatus('Could not share plot', true);
        }
      }

      async function shareData() {
        try {
          const selected = Array.from(state.selectedSensors);
          const payload = JSON.stringify({
            generatedAt: new Date().toISOString(),
            sensors: selected.map((sensorId) => ({
              sensorId,
              points: state.history[sensorId] || []
            }))
          }, null, 2);

          if (navigator.share) {
            await navigator.share({
              title: 'AeroChamber data',
              text: payload
            });
            return;
          }

          if (navigator.clipboard) {
            await navigator.clipboard.writeText(payload);
            updateStatus('Pressure data copied to clipboard');
            return;
          }

          const blob = new Blob([payload], { type: 'application/json' });
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = 'aerochamber-data.json';
          link.click();
          URL.revokeObjectURL(link.href);
        } catch (error) {
          updateStatus('Could not share data', true);
        }
      }

      async function loadSensors() {
        try {
          const response = await fetch('/api/sensors');
          const data = await response.json();
          const sensors = Array.isArray(data.sensors) ? data.sensors : [];

          renderSensorList(sensors);
          renderSensorSelector(sensors);
          recordHistory(sensors);
          updateStatus('Data refreshed');
        } catch (error) {
          updateStatus('Connection error', true);
        }
      }

      document.getElementById('stop-btn').addEventListener('click', handleStop);
      document.getElementById('start-btn').addEventListener('click', handleStart);
      document.getElementById('reset-btn').addEventListener('click', handleReset);
      document.getElementById('share-plot-btn').addEventListener('click', sharePlot);
      document.getElementById('share-data-btn').addEventListener('click', shareData);

      document.getElementById('start-btn').disabled = true;
      document.getElementById('stop-btn').disabled = false;

      setInterval(loadSensors, 100);
      loadSensors();
      renderHistoryChart();
    </script>
  </body>
</html>
